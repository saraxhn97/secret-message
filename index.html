<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Para mi conejito 🐰</title>

<style>
body{
  font-family: Arial, sans-serif;
  background: #ffeef5;
  text-align:center;
  padding-top:100px;
}

.carta{
  background:white;
  max-width:600px;
  margin:auto;
  padding:30px;
  border-radius:20px;
  box-shadow:0 0 20px rgba(0,0,0,0.1);
}

button{
  background:#ff6fa5;
  color:white;
  border:none;
  padding:15px 25px;
  border-radius:10px;
  font-size:18px;
  cursor:pointer;
}

#mensaje{
  display:none;
  margin-top:20px;
}
</style>

</head>

<body>

<div class="carta">
  <h1>🐰 Para mi conejito 🐰</h1>

  <button onclick="mostrarMensaje()">
    Abrir sorpresa 💌
  </button>

  <div id="mensaje">
    <h2>Te extraño muchísimo ❤️</h2>

    <p>
      Aunque estemos lejos, quería hacer algo diferente para ti.
    </p>

    <p>
      Cada día pienso en ti y cuento los días para volver a darte un besito.
    </p>

    <p>
      Gracias por hacerme tan feliz.
    </p>

    <h3>Te amo, conejito 🐰✨</h3>
  </div>
</div>

<script>
function mostrarMensaje() {
  document.getElementById("mensaje").style.display = "block";
}
</script>

</body>
</html>
